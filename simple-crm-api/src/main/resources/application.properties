spring.application.name=simple-crm-lite

# Render injects PORT; 8080 locally.
server.port=${PORT:8080}

# Database settings come only from environment variables (never committed).
# On Render: SPRING_DATASOURCE_URL=jdbc:postgresql://<host>:5432/<db>
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=${SHOW_SQL:false}

# Module 4 (Option 3): Netlify URL of the React app, comma-separated.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
