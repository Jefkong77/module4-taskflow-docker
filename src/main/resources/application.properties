spring.application.name=taskflow-api
server.port=${PORT:8080}
# Keep the primitive completed flag false when it is omitted or null in JSON.
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Task 6: keep the real key in the shell environment, outside the project.
# Module 4: default lets the container start on Render without a key;
# only GET /api/tasks/summary needs a real OPENAI_API_KEY.
spring.ai.openai.api-key=${OPENAI_API_KEY:not-configured}
spring.ai.openai.base-url=${OPENAI_BASE_URL:https://api.openai.com/v1}
spring.ai.openai.chat.model=${OPENAI_MODEL:gpt-4o-mini}
spring.ai.openai.timeout=15s
spring.ai.openai.max-retries=0

# Module 4 (Option 2): browser origins allowed to call the API, comma-separated.
# Set CORS_ALLOWED_ORIGINS on Render to your Netlify URL.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173,http://localhost:8888}

# Module 4: load four sample tasks at startup (in-memory data is lost on each restart).
app.seed-sample-tasks=${SEED_SAMPLE_TASKS:true}
