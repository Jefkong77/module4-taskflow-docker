<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>TaskFlow</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 16 16%22%3E%3Crect width=%2216%22 height=%2216%22 rx=%224%22 fill=%22%231b2a6b%22/%3E%3Cpath d=%22M4 8.5l2.5 2.5L12 5%22 stroke=%22white%22 stroke-width=%222%22 fill=%22none%22/%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main class="shell">
    <header class="top">
      <div>
        <h1>TaskFlow</h1>
        <p class="sub">Module 4 frontend on Netlify, reading the TaskFlow API on Render</p>
      </div>
      <div class="api">
        <span id="api-status" class="dot dot-wait" aria-hidden="true"></span>
        <span id="api-label">Connecting…</span>
      </div>
    </header>

    <section class="stats" aria-label="Task counts">
      <div class="stat"><span id="count-total">–</span><small>Total</small></div>
      <div class="stat"><span id="count-pending">–</span><small>Pending</small></div>
      <div class="stat"><span id="count-done">–</span><small>Completed</small></div>
    </section>

    <form id="new-task" class="new-task" autocomplete="off">
      <label for="title" class="visually-hidden">New task title</label>
      <input id="title" name="title" type="text" placeholder="Add a task…" maxlength="200" required />
      <button type="submit">Add</button>
    </form>

    <p id="message" class="message" role="status" hidden></p>

    <ul id="task-list" class="task-list" aria-live="polite"></ul>
    <p id="empty" class="empty" hidden>No tasks yet. Add one above.</p>

    <footer class="foot">
      API: <code id="api-url"></code>
      <span class="note">Free Render services sleep after 15 minutes; the first load can take about a minute.</span>
    </footer>
  </main>

  <!-- config.js is generated by Netlify at build time (see netlify.toml). -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
