# Module 4 stretch goals in one pipeline:
#   Option 1 - CI: test, build and publish the image to Docker Hub on every push to main
#   Option 4 - versioned images: semver (from git tags v1.2.3), commit SHA, and latest
#   Option 5 - security: secret scan, OWASP Dependency-Check, Trivy image scan
# Render deploys separately from GitHub (Task 3), so CI and deployment run side by side.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/taskflow-api
  TRIVY_VERSION: "0.71.2"

jobs:
  test:
    name: Build and unit test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run tests
        run: ./mvnw -B verify
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: target/surefire-reports/

  secret-scan:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan the full history, not just the last commit
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  dependency-check:
    name: OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-${{ github.run_id }}
          restore-keys: nvd-
      # v1.1.0: reviewed false positives are suppressed (with reasons) in
      # dependency-check-suppressions.xml, and any new CRITICAL (CVSS >= 9) fails the build.
      - name: Scan dependencies
        run: >
          ./mvnw -B org.owasp:dependency-check-maven:12.2.2:check
          -DnvdApiKey=${{ secrets.NVD_API_KEY }}
          -DsuppressionFiles=dependency-check-suppressions.xml
          -Dformats=HTML,JSON
          -DfailBuildOnCVSS=9
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-check-report
          path: target/dependency-check-report.*

  docker:
    name: Build, scan and push image
    needs: [test, secret-scan, dependency-check]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Image tags (semver, sha, latest)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/setup-buildx-action@v3

      - name: Build image locally for scanning
        uses: docker/build-push-action@v6
        with:
          context: .
          load: true
          tags: taskflow-api:scan

      # trivy-action tags were hijacked in March 2026 (CVE-2026-33634), so install
      # a pinned, checksum-verified Trivy release instead of using the action.
      - name: Install Trivy ${{ env.TRIVY_VERSION }}
        run: |
          base=https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}
          tarball=trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz
          curl -sSLO "$base/$tarball"
          curl -sSLO "$base/trivy_${TRIVY_VERSION}_checksums.txt"
          grep " $tarball\$" trivy_${TRIVY_VERSION}_checksums.txt | sha256sum -c -
          tar -xzf "$tarball" trivy
          sudo mv trivy /usr/local/bin/trivy
          trivy --version

      - name: Trivy scan (full report)
        run: trivy image --severity LOW,MEDIUM,HIGH,CRITICAL --format table --output trivy-report.txt taskflow-api:scan

      - name: Trivy gate (fail on fixable CRITICAL)
        run: trivy image --severity CRITICAL --ignore-unfixed --exit-code 1 taskflow-api:scan

      - name: Upload Trivy report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt

      - name: Log in to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
